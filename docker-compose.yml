networks:
  proxy:
    external: true

volumes:
  gitea:
    driver: local

services:
  server:
    image: docker.gitea.com/gitea:28.2.0@sha256:30777c91280d973fa02be48b1ade735bd6859e8f6f7af3b4444d519437852504
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=${DB_NAME}
      - GITEA__database__USER=${DB_USER}
      - GITEA__database__PASSWD=${DB_PASSWORD}
      - GITEA__server__ROOT_URL=${ROOT_URL}
      - GITEA__metrics__ENABLED=true
      - GITEA__repository__ENABLE_PUSH_CREATE_USER=true
      - GITEA__ui__SHOW_USER_EMAIL=false
      - GITEA__service__DEFAULT_KEEP_EMAIL_PRIVATE=true
      - GITEA__service__NO_REPLY_ADDRESS=noreply.homelab
    restart: always
    networks:
      - proxy
    volumes:
      - gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "222:22"
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gitea-router.rule=Host(`gitea.${HOMELAB_DOMAIN}`)"
      - "traefik.http.routers.gitea-router.entrypoints=websecure"
      - "traefik.http.routers.gitea-router.tls.certresolver=le"
      - "traefik.http.services.gitea.loadbalancer.server.url=http://server:3000"
      - "traefik.http.routers.gitea-router.service=gitea"

  db:
    image: docker.io/library/postgres:14@sha256:0472f5295d05c211cc42b3daa5e84a128e390c5267b60ced9fe044bcf4edfdb8
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - proxy
    volumes:
      - ./postgres:/var/lib/postgresql/data
